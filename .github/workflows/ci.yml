
name: User Login API CI

on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'server.js'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: Success
        run: echo "All API tests passed!"
