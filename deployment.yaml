apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-login-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-login
  template:
    metadata:
      labels:
        app: user-login
    spec:
     containers:
        - name: user-login-container
          image: user-login:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000